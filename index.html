<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>السعداء جروب – إدارة تكاليف الورش</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--g:#0f5132;--g2:#14803f;--bg:#f2f6f3;--card:#fff;--tx:#14231b;--mu:#5d6f65;--bd:#d9e4dc;--er:#b42318;--ok:#14803f;--hl:#e6f2ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1511;--card:#16211b;--tx:#e8f1ec;--mu:#9bb0a4;--bd:#2a3a31;--hl:#1d2f25;--g:#1f7a4d;--g2:#35b26a;--er:#f97066;color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,Tahoma,"Segoe UI",Arial,sans-serif;font-size:15px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--bd);border-radius:8px;background:var(--card)}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--g2);outline-offset:1px}
textarea{resize:vertical;min-height:42px}
label{display:block;font-size:13px;color:var(--mu);margin-bottom:3px;font-weight:600}
.btn{background:var(--g);color:#fff;border:0;border-radius:8px;padding:10px 18px;font-weight:700;cursor:pointer}
.btn.s{background:var(--hl);color:var(--g);border:1px solid var(--bd)}
.btn.d{background:transparent;color:var(--er);border:1px solid var(--er)}
.btn.sm{padding:5px 10px;font-size:13px}
.login{min-height:100vh;display:grid;place-items:center;padding:18px;background:linear-gradient(160deg,var(--g) 0,var(--g) 38%,var(--bg) 38%)}
.lc{background:var(--card);width:100%;max-width:400px;border-radius:16px;padding:26px 22px;box-shadow:0 10px 30px rgba(0,0,0,.18);text-align:center}
.lc h1{margin:8px 0 0;font-size:26px;color:var(--g);font-weight:800}
.lc .sub{color:var(--mu);margin:0 0 18px}
.lc .en{font-size:12px;letter-spacing:2px;color:var(--mu);margin:0}
.f{text-align:right;margin-bottom:12px}
.pw{display:flex;gap:6px}.pw button{width:46px;padding:0}
.err{color:var(--er);font-weight:600;min-height:22px;margin-bottom:6px}
.logo{width:100%;max-width:240px;height:auto;background:#fff;border-radius:10px;padding:8px}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:var(--g);color:#fff;padding:16px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
aside .br{display:flex;gap:10px;align-items:center;padding:4px 6px 14px;border-bottom:1px solid rgba(255,255,255,.2);margin-bottom:8px}
aside .br b{display:block;line-height:1.2}aside .br small{opacity:.8}
.br .logo{max-width:none;padding:8px 10px}
.nv{background:none;border:0;color:#fff;text-align:right;padding:10px 12px;border-radius:8px;cursor:pointer;display:flex;gap:9px;align-items:center;font-weight:600;opacity:.88}
.nv.on,.nv:hover{background:rgba(255,255,255,.16);opacity:1}
.who{margin-top:auto;font-size:13px;opacity:.9;padding:8px 6px}
main{padding:20px;max-width:1100px;width:100%}
h2{margin:0 0 14px;color:var(--g);font-size:22px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.grid{display:grid;gap:12px}
.st{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.st .card{margin:0;border-top:4px solid var(--g2)}
.st b{display:block;font-size:21px;font-weight:800}.st span{color:var(--mu);font-size:13px}
.hd{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}
th{background:var(--hl);color:var(--g)}
.it{display:grid;grid-template-columns:150px 1fr 80px 110px 110px 40px;gap:8px;align-items:end;padding:10px 0;border-bottom:1px dashed var(--bd)}
.tot{display:flex;justify-content:space-between;align-items:center;background:var(--hl);border-radius:10px;padding:12px 14px;font-size:18px;font-weight:800;color:var(--g);margin:12px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row .grow{flex:1;min-width:160px}
.tag{background:var(--hl);color:var(--g);border-radius:20px;padding:2px 10px;font-size:12px;font-weight:700}
#mod{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;place-items:center;padding:14px;z-index:20}
#mod>div{background:var(--card);border-radius:14px;padding:18px;max-width:640px;width:100%;max-height:88vh;overflow:auto}
#toast{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--g);color:#fff;padding:10px 18px;border-radius:24px;display:none;z-index:30;font-weight:600}
.bn{display:none}
@media(max-width:820px){
.app{grid-template-columns:1fr}aside{display:none}
main{padding:14px 12px 90px}
.bn{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--g);z-index:10;padding-bottom:env(safe-area-inset-bottom,0px)}
.bn button{flex:1;background:none;border:0;color:#fff;padding:8px 2px;font-size:11px;opacity:.8;font-weight:600}
.bn button.on{opacity:1;background:rgba(255,255,255,.18)}.bn i{display:block;font-style:normal;font-size:19px}
.it{grid-template-columns:1fr 1fr;padding:12px;border:1px solid var(--bd);border-radius:10px;margin-bottom:8px}
.it>div:nth-child(1),.it>div:nth-child(2){grid-column:1/-1}
.hdm{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
}
@media print{aside,.bn,.np{display:none!important}.app{display:block}}
</style>
</head>
<body>
<div id="root"></div><div id="mod"></div><div id="toast"></div>
<script>
// ===== إعدادات قاعدة البيانات (Supabase): الصق هنا الرابط والمفتاح =====
const SB_URL='https://vfjpcfxfoajqpkizywxg.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZmanBjZnhmb2FqcXBraXp5d3hnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ2NDQzMjMsImV4cCI6MjExMDIyMDMyM30.629DS6HOPtCcma8-tWCSHYc9viewosNnnmDXAr4WcoY';
// ======================================================================
window.addEventListener('error',function(e){var b=document.getElementById('errbar');if(!b){b=document.createElement('div');b.id='errbar';b.style.cssText='position:fixed;top:0;left:0;right:0;background:#b42318;color:#fff;padding:8px;font-size:13px;z-index:99;direction:ltr';document.body.appendChild(b)}b.textContent='JS error: '+e.message});
window.addEventListener('unhandledrejection',function(e){var b=document.getElementById('errbar');if(!b){b=document.createElement('div');b.id='errbar';b.style.cssText='position:fixed;top:0;left:0;right:0;background:#b42318;color:#fff;padding:8px;font-size:13px;z-index:99;direction:ltr';document.body.appendChild(b)}b.textContent='Error: '+(e.reason&&e.reason.message||e.reason)});
let CFG=null;
const normUrl=x=>{x=String(x||'').trim().replace(/^['"]+|['"]+$/g,'');let m=x.match(/https?:\/\/([a-z0-9]{15,30})\.supabase\.co/i);if(m)return'https://'+m[1].toLowerCase()+'.supabase.co';m=x.match(/project\/([a-z0-9]{15,30})/i);if(m)return'https://'+m[1].toLowerCase()+'.supabase.co';if(/^[a-z0-9]{15,30}$/i.test(x))return'https://'+x.toLowerCase()+'.supabase.co';return''};
const normKey=x=>String(x||'').replace(/\s+/g,'').replace(/^['"]+|['"]+$/g,'');
(function(){
 let u=normUrl(SB_URL),k=normKey(SB_KEY);
 if(!u||k.length<20||k.indexOf('PASTE')>=0){try{const c=JSON.parse(localStorage.getItem('soadaa_cfg'));if(c){u=normUrl(c.url);k=normKey(c.key)}}catch(e){}}
 if(u&&k.length>=20&&k.indexOf('PASTE')<0)CFG={url:u,key:k};
})();
const hdr=()=>{const h={apikey:CFG.key,'Content-Type':'application/json'};if(CFG.key.indexOf('eyJ')===0)h.Authorization='Bearer '+CFG.key;return h};
async function rq(p,o){
 const r=await fetch(CFG.url+'/rest/v1/'+p,Object.assign({headers:hdr()},o));
 const t=await r.text();
 if(!r.ok){let m=t;try{m=JSON.parse(t).message||t}catch(e){}throw new Error('HTTP '+r.status+' '+m)}
 return t?JSON.parse(t):null;
}
function makeDB(){
 if(!CFG)return null;
 const colOf=p=>p.split('/').slice(0,-1).join('/'),q=encodeURIComponent;
 const watch=load=>{load();const t=setInterval(load,5000);return()=>clearInterval(t)};
 return{
  doc:path=>({
   set:d=>rq('kv?on_conflict=path',{method:'POST',headers:Object.assign(hdr(),{Prefer:'resolution=merge-duplicates,return=minimal'}),body:JSON.stringify({path,col:colOf(path),data:d})}),
   delete:()=>rq('kv?path=eq.'+q(path),{method:'DELETE'}),
   onSnapshot(next,err){let last;return watch(async()=>{try{const a=await rq('kv?select=data&path=eq.'+q(path));const j=JSON.stringify(a);if(j===last)return;last=j;next({exists:a.length>0,fromCache:false,data:()=>a.length?a[0].data:undefined})}catch(e){err&&err(e)}})}
  }),
  collection:name=>({
   onSnapshot(next,err){let last;return watch(async()=>{try{const a=await rq('kv?select=path,data&col=eq.'+q(name));const j=JSON.stringify(a);if(j===last)return;last=j;next({docs:a.map(r=>({id:r.path.split('/').pop(),data:()=>r.data}))})}catch(e){err&&err(e)}})}
  })
 };
}
function showCfg(){
 const s=document.getElementById('sy');if(!s||document.getElementById('cfgbox'))return;
 s.insertAdjacentHTML('afterend','<div id="cfgbox" class="f"><label>Project URL</label><input id="cu1" dir="ltr" placeholder="https://xxxx.supabase.co"><label style="margin-top:6px">المفتاح (anon public أو Publishable)</label><input id="ck1" dir="ltr"><button type="button" class="btn s" id="cs" style="margin-top:8px;width:100%">حفظ وربط</button></div>');
 document.getElementById('cs').onclick=()=>{
  const u=normUrl(document.getElementById('cu1').value),k=normKey(document.getElementById('ck1').value),m=document.getElementById('sy');
  const bad=t=>{m.textContent=t;m.style.color='var(--er)'};
  if(!u)return bad('الـ URL غير صحيح. لازم يكون بالشكل https://xxxx.supabase.co');
  if(k.length<20)return bad('المفتاح غير صحيح أو ناقص. انسخه كامل.');
  try{localStorage.setItem('soadaa_cfg',JSON.stringify({url:u,key:k}))}catch(e){}
  if(!localStorage.getItem('soadaa_cfg'))return bad('المتصفح بيمنع الحفظ. افتح الرابط من نافذة عادية، أو الصق المفتاحين داخل الملف.');
  location.reload()};
}
</script>

let S,me=null,view='dash',editId=null,q='';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fm=n=>(+n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})+' ج.م';
const now=()=>new Date().toLocaleString('ar-EG');
const today=()=>new Date().toISOString().slice(0,10);
let DB=null,ready=false,syT='جارٍ تحميل الموقع… (الإصدار 5)',syBad=0,ld,rd;
S={users:[{id:1,name:'م/ محمد سيد',pw:'01210309901',perms:{...ALL}},{id:2,name:'أ/ محمد عزوز',pw:'01119667236',perms:{...ALL}}],inv:[],del:[]};
const er=e=>toast('تعذر الحفظ: '+((e&&e.message)||'تحقق من الاتصال'));
function setSy(t,b){if(t!==undefined){syT=t;syBad=b}const s=$('#sy');if(s){s.textContent=syT;s.style.color=syBad?'var(--er)':'var(--ok)'}const l=$('#lb');if(l)l.disabled=!ready}
const saveUsers=()=>{if(DB)DB.doc('settings/users').set({list:S.users}).catch(er);else er()};
const cp=o=>JSON.parse(JSON.stringify(o));
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2200)};
const logo=c=>LOGO?`<img class="${c}" src="${esc(LOGO)}" alt="شعار السعداء">`:`<svg class="${c}" viewBox="0 0 100 100" role="img" aria-label="شعار السعداء"><path d="M50 5 90 20v30c0 25-17 38-40 46C27 88 10 75 10 50V20z" fill="#0f5132"/><path d="M50 14 82 26v24c0 19-13 30-32 37-19-7-32-18-32-37V26z" fill="none" stroke="#fff" stroke-width="3"/><text x="50" y="62" font-size="38" font-weight="800" fill="#fff" text-anchor="middle" font-family="Cairo,Tahoma,sans-serif">س</text></svg>`;
const can=p=>me&&me.perms[p];
const tot=i=>i.items.reduce((a,x)=>a+x.qty*x.price,0);

function login(){
 $('#root').innerHTML=`<div class="login"><div class="lc">${logo('logo')}<h1>السعداء جروب</h1><p class="sub">ورش صيانة الملاكي والنقل الخفيف</p>
 <div class="f"><label for="lu">اسم المستخدم</label><select id="lu">${S.users.map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join('')}</select></div>
 <div class="f"><label for="lp">كلمة المرور</label><div class="pw"><input id="lp" type="password" autocomplete="current-password"><button type="button" class="btn s" id="tp" aria-label="إظهار أو إخفاء كلمة المرور">👁</button></div></div>
 <div class="err" id="le" role="alert"></div><p id="sy" style="font-size:12px;margin:0 0 8px"></p><button class="btn" style="width:100%" id="lb">تسجيل الدخول</button></div></div>`;
 $('#tp').onclick=()=>{const p=$('#lp');p.type=p.type==='password'?'text':'password'};
 const go=()=>{if(!ready)return;const u=S.users.find(x=>x.id==$('#lu').value);if(u&&u.pw===$('#lp').value){me=u;view='dash';shell()}else{$('#le').textContent='اسم المستخدم أو كلمة المرور غير صحيحة. حاول مرة أخرى.'}};
 $('#lb').onclick=go;setSy();$('#lp').onkeydown=e=>{if(e.key==='Enter')go()};
}
const NAV=[['dash','🏠','الرئيسية'],['add','➕','فاتورة جديدة'],['list','🧾','الفواتير'],['rep','📊','التقارير'],['set','⚙️','الحساب']];
function shell(){
 const nav=cls=>NAV.filter(n=>!(n[0]==='add'&&!can('add'))&&!(n[0]==='rep'&&!can('rep'))).map(n=>`<button class="${cls} ${view===n[0]?'on':''}" data-v="${n[0]}"><span>${n[1]}</span> ${n[2]}</button>`).join('');
 $('#root').innerHTML=`<div class="app"><aside><div class="br">${logo('logo')}</div>${nav('nv')}<div class="who">👤 ${esc(me.name)}<br><button class="btn s sm" id="out" style="margin-top:6px">تسجيل الخروج</button></div></aside><main id="m"></main></div><nav class="bn">${NAV.filter(n=>!(n[0]==='add'&&!can('add'))&&!(n[0]==='rep'&&!can('rep'))).map(n=>`<button class="${view===n[0]?'on':''}" data-v="${n[0]}"><i>${n[1]}</i>${n[2]}</button>`).join('')}</nav>`;
 document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{view=b.dataset.v;if(view!=='add')editId=null;shell()});
 $('#out').onclick=()=>{me=null;login()};
 ({dash,add:addV,list,rep,set})[view]();
}
function sums(arr){const r=[0,0,0];arr.forEach(i=>i.items.forEach(x=>{const k=TY.indexOf(x.type);if(k>-1)r[k]+=x.qty*x.price}));return r}
function dash(){
 const s=sums(S.inv),t=s[0]+s[1]+s[2];
 const st=[['إجمالي تكاليف الورشة',fm(t)],['عدد الفواتير',S.inv.length],['إجمالي قطع الغيار',fm(s[0])],['إجمالي الصيانة الخارجية',fm(s[1])],['إجمالي النقل',fm(s[2])]];
 const last=[...S.inv].sort((a,b)=>b.id-a.id).slice(0,6);
 $('#m').innerHTML=`<h2>مرحبًا ${esc(me.name)}</h2><div class="grid st">${st.map(x=>`<div class="card"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div>
 <div class="card" style="margin-top:14px"><b>أحدث الفواتير المسجلة</b><div class="tw">${last.length?tbl(last,false):'<p style="color:var(--mu)">لا توجد فواتير بعد. سجّل أول فاتورة من زر «فاتورة جديدة».</p>'}</div></div>`;
 bindRows();
}
function tbl(a,act){
 return `<table><tr><th>رقم الفاتورة</th><th>التاريخ</th><th>السيارة</th><th>الإجمالي</th><th>سجّلها</th><th></th></tr>${a.map(i=>`<tr><td>${esc(i.no)}</td><td>${esc(i.date)}</td><td>${esc(i.plate)} <span class="tag">${esc(i.code)}</span></td><td>${fm(tot(i))}</td><td>${esc(i.by)}</td><td><button class="btn s sm" data-vw="${i.id}">عرض</button>${act&&can('edit')?` <button class="btn s sm" data-ed="${i.id}">تعديل</button>`:''}${act&&can('del')?` <button class="btn d sm" data-dl="${i.id}">حذف</button>`:''}</td></tr>`).join('')}</table>`;
}
function bindRows(){
 document.querySelectorAll('[data-vw]').forEach(b=>b.onclick=()=>show(+b.dataset.vw));
 document.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>{editId=+b.dataset.ed;view='add';shell()});
 document.querySelectorAll('[data-dl]').forEach(b=>b.onclick=()=>{const i=S.inv.find(x=>x.id==b.dataset.dl);if(confirm('حذف الفاتورة رقم '+i.no+'؟')){const dd={no:i.no,plate:i.plate,total:tot(i),by:me.name,at:now(),ts:Date.now()};S.inv=S.inv.filter(x=>x!==i);S.del.push(dd);if(DB){DB.doc('invoices/'+i.id).delete().catch(er);DB.doc('deleted/'+dd.ts).set(dd).catch(er)}else er();toast('تم حذف الفاتورة');shell()}});
}
function show(id){
 const i=S.inv.find(x=>x.id===id),m=$('#mod');
 m.innerHTML=`<div><h2>فاتورة رقم ${esc(i.no)}</h2><p>السيارة: <b>${esc(i.plate)}</b> – الكود: ${esc(i.code)}<br>التاريخ: ${esc(i.date)} – السداد: ${esc(i.method)}<br>جهة الخصم/العهدة: ${esc(i.custody)}<br>طلب الأوردر: ${esc(i.order||'-')} – أمر التوريد: ${esc(i.po||'-')}</p>
 <div class="tw"><table><tr><th>النوع</th><th>البيان</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th></tr>${i.items.map(x=>`<tr><td>${esc(x.type)}</td><td style="white-space:normal">${esc(x.desc)}</td><td>${x.qty}</td><td>${fm(x.price)}</td><td>${fm(x.qty*x.price)}</td></tr>`).join('')}</table></div>
 <div class="tot"><span>إجمالي الفاتورة</span><span>${fm(tot(i))}</span></div>
 <p style="color:var(--mu);font-size:13px">سجّلها: ${esc(i.by)} – ${esc(i.at)}${i.modBy?`<br>آخر تعديل: ${esc(i.modBy)} – ${esc(i.modAt)}`:''}</p><button class="btn" id="cl">إغلاق</button></div>`;
 m.style.display='grid';$('#cl').onclick=()=>m.style.display='none';
}
const itRow=x=>`<div class="it"><div><label>نوع البيان</label><select class="ty">${TY.map(t=>`<option ${x.type===t?'selected':''}>${t}</option>`).join('')}</select></div><div><label>وصف البيان</label><textarea class="ds" rows="1">${esc(x.desc)}</textarea></div><div><label>الكمية</label><input class="qt" type="number" min="0" step="any" value="${x.qty}" inputmode="decimal"></div><div><label>سعر الوحدة</label><input class="pr" type="number" min="0" step="any" value="${x.price}" inputmode="decimal"></div><div><label>إجمالي البند</label><input class="lt" readonly></div><div><button type="button" class="btn d sm rm" aria-label="حذف البند">✕</button></div></div>`;
function addV(){
 if(!can('add')&&!editId){$('#m').innerHTML='<h2>غير مصرّح</h2><p>ليس لديك صلاحية تسجيل الفواتير.</p>';return}
 const e=editId?S.inv.find(x=>x.id===editId):{plate:'',code:'',no:'',date:today(),method:'نقدي',custody:'',order:'',po:'',items:[{type:TY[0],desc:'',qty:1,price:0}]};
 const f=(id,l,v,t='text')=>`<div><label for="${id}">${l}</label><input id="${id}" type="${t}" value="${esc(v)}"></div>`;
 $('#m').innerHTML=`<h2>${editId?'تعديل فاتورة':'تسجيل فاتورة جديدة'}</h2><div class="card"><div class="grid hd">
 ${f('pl','رقم السيارة / اللوحة',e.plate)}${f('cd','كود السيارة',e.code)}${f('no','رقم الفاتورة',e.no)}${f('dt','تاريخ الفاتورة',e.date,'date')}
 <div><label for="mt">طريقة السداد</label><select id="mt">${['نقدي','شيك','تحويل بنكي','آجل','عهدة'].map(x=>`<option ${e.method===x?'selected':''}>${x}</option>`).join('')}</select></div>
 <div><label for="cu">جهة الخصم / العهدة</label><input id="cu" list="cl" value="${esc(e.custody)}"><datalist id="cl">${S.users.map(u=>`<option value="عهدة ${esc(u.name)}">`).join('')}<option value="حساب الشركة"></datalist></div>
 ${f('od','طلب الأوردر',e.order)}${f('po','رقم أمر التوريد',e.po)}</div></div>
 <div class="card"><b>بنود الفاتورة</b><div id="its">${e.items.map(itRow).join('')}</div><button class="btn s" id="ai" style="margin-top:10px">+ إضافة بند</button>
 <div class="tot"><span>إجمالي الفاتورة</span><span id="gt">0</span></div><div class="row"><button class="btn" id="sv">حفظ الفاتورة</button><button class="btn s" id="cn">إلغاء</button></div></div>`;
 const calc=()=>{let g=0;document.querySelectorAll('.it').forEach(r=>{const l=(+r.querySelector('.qt').value||0)*(+r.querySelector('.pr').value||0);r.querySelector('.lt').value=fm(l);g+=l});$('#gt').textContent=fm(g)};
 const wire=()=>{document.querySelectorAll('.qt,.pr').forEach(x=>x.oninput=calc);document.querySelectorAll('.rm').forEach(b=>b.onclick=()=>{if(document.querySelectorAll('.it').length>1){b.closest('.it').remove();calc()}})};
 wire();calc();
 $('#ai').onclick=()=>{$('#its').insertAdjacentHTML('beforeend',itRow({type:TY[0],desc:'',qty:1,price:0}));wire();calc()};
 $('#cn').onclick=()=>{editId=null;view='list';shell()};
 $('#sv').onclick=()=>{
  const items=[...document.querySelectorAll('.it')].map(r=>({type:r.querySelector('.ty').value,desc:r.querySelector('.ds').value.trim(),qty:+r.querySelector('.qt').value||0,price:+r.querySelector('.pr').value||0}));
  const d={plate:$('#pl').value.trim(),code:$('#cd').value.trim(),no:$('#no').value.trim(),date:$('#dt').value,method:$('#mt').value,custody:$('#cu').value.trim(),order:$('#od').value.trim(),po:$('#po').value.trim(),items};
  if(!d.plate||!d.no||!d.date){toast('أدخل رقم السيارة ورقم الفاتورة والتاريخ');return}
  if(items.some(x=>!x.desc||x.qty<=0)){toast('كل بند يحتاج وصفًا وكمية أكبر من صفر');return}
  let o;if(editId){o=Object.assign(e,d,{modBy:me.name,modAt:now()})}else{o={...d,id:Date.now(),by:me.name,at:now()};S.inv.push(o)}
  if(DB)DB.doc('invoices/'+o.id).set(o).catch(er);else er();toast('تم حفظ الفاتورة');editId=null;view='list';shell();
 };
}
function list(){
 $('#m').innerHTML=`<h2>الفواتير</h2><div class="card np"><input id="sq" placeholder="ابحث برقم السيارة أو الكود أو رقم الفاتورة أو أمر التوريد أو البيان" value="${esc(q)}"></div><div class="card"><div class="tw" id="lt"></div></div>
 <div class="card"><b>سجل المحذوفات</b><div class="tw">${S.del.length?`<table><tr><th>الفاتورة</th><th>السيارة</th><th>القيمة</th><th>حذفها</th><th>الوقت</th></tr>${S.del.map(x=>`<tr><td>${esc(x.no)}</td><td>${esc(x.plate)}</td><td>${fm(x.total)}</td><td>${esc(x.by)}</td><td>${esc(x.at)}</td></tr>`).join('')}</table>`:'<p style="color:var(--mu)">لا توجد فواتير محذوفة.</p>'}</div></div>`;
 const draw=()=>{const s=q.trim().toLowerCase(),a=S.inv.filter(i=>!s||[i.plate,i.code,i.no,i.po,i.order,...i.items.map(x=>x.desc)].join(' ').toLowerCase().includes(s)).sort((a,b)=>b.id-a.id);$('#lt').innerHTML=a.length?tbl(a,true):'<p style="color:var(--mu)">لا توجد نتائج مطابقة.</p>';bindRows()};
 ld=draw;draw();$('#sq').oninput=e=>{q=e.target.value;draw()};
}
function rep(){
 if(!can('rep')){$('#m').innerHTML='<h2>غير مصرّح</h2><p>ليس لديك صلاحية عرض التقارير.</p>';return}
 $('#m').innerHTML=`<h2>التقارير</h2><div class="card np row"><div class="grow"><label>من تاريخ</label><input type="date" id="f1"></div><div class="grow"><label>إلى تاريخ</label><input type="date" id="f2"></div><button class="btn" id="pr">طباعة</button></div><div id="rb"></div>`;
 const draw=()=>{
  const a=S.inv.filter(i=>(!$('#f1').value||i.date>=$('#f1').value)&&(!$('#f2').value||i.date<=$('#f2').value)),s=sums(a),by={};
  a.forEach(i=>{by[i.plate]=(by[i.plate]||0)+tot(i)});
  $('#rb').innerHTML=`<div class="card"><b>حسب نوع البيان</b><div class="tw"><table><tr><th>النوع</th><th>الإجمالي</th></tr>${TY.map((t,k)=>`<tr><td>${t}</td><td>${fm(s[k])}</td></tr>`).join('')}<tr><th>الإجمالي الكلي</th><th>${fm(s[0]+s[1]+s[2])}</th></tr></table></div></div>
  <div class="card"><b>حسب السيارة</b><div class="tw">${a.length?`<table><tr><th>السيارة</th><th>التكلفة</th></tr>${Object.entries(by).sort((x,y)=>y[1]-x[1]).map(x=>`<tr><td>${esc(x[0])}</td><td>${fm(x[1])}</td></tr>`).join('')}</table>`:'<p style="color:var(--mu)">لا توجد بيانات في هذه الفترة.</p>'}</div></div>`};
 rd=draw;draw();$('#f1').onchange=draw;$('#f2').onchange=draw;$('#pr').onclick=()=>window.print();
}
function set(){
 $('#m').innerHTML=`<h2>إعدادات الحساب</h2><div class="card" style="max-width:460px"><b>تغيير كلمة المرور – ${esc(me.name)}</b>
 <div class="f" style="margin-top:10px"><label for="p0">كلمة المرور الحالية</label><input id="p0" type="password"></div><div class="f"><label for="p1">كلمة المرور الجديدة</label><input id="p1" type="password"></div><div class="f"><label for="p2">تأكيد كلمة المرور الجديدة</label><input id="p2" type="password"></div>
 <div class="err" id="pe" role="alert"></div><button class="btn" id="ps">حفظ التغييرات</button><p style="color:var(--mu);font-size:13px">كلمة المرور الحالية: <b id="cur" style="direction:ltr;display:inline-block">${esc(me.pw)}</b></p></div>
 ${can('perm')?`<div class="card"><b>صلاحيات المستخدمين</b><div class="tw"><table><tr><th>المستخدم</th>${Object.values(P).map(x=>`<th>${x}</th>`).join('')}</tr>${S.users.map(u=>`<tr><td>${esc(u.name)}</td>${Object.keys(P).map(k=>`<td><input type="checkbox" style="width:auto" data-u="${u.id}" data-p="${k}" ${u.perms[k]?'checked':''} aria-label="${P[k]}"></td>`).join('')}</tr>`).join('')}</table></div></div>`:''}`;
 $('#ps').onclick=()=>{const e=$('#pe');
  if($('#p0').value!==me.pw)return e.textContent='كلمة المرور الحالية غير صحيحة.';
  if($('#p1').value.length<4)return e.textContent='كلمة المرور الجديدة قصيرة جدًا (4 أحرف على الأقل).';
  if($('#p1').value!==$('#p2').value)return e.textContent='تأكيد كلمة المرور غير مطابق.';
  me.pw=$('#p1').value;saveUsers();toast('تم تغيير كلمة المرور');set()};
 document.querySelectorAll('[data-u]').forEach(c=>c.onchange=()=>{const u=S.users.find(x=>x.id==c.dataset.u);u.perms[c.dataset.p]=c.checked?1:0;if(u===me&&!me.perms.perm){u.perms.perm=1;c.checked=true;toast('لا يمكنك سحب صلاحية الإدارة من نفسك')}saveUsers();toast('تم تحديث الصلاحيات')});
}
function refresh(){if(!me)return;if(view==='dash')dash();else if(view==='list'){if(document.activeElement&&document.activeElement.id==='sq'&&ld)ld();else list()}else if(view==='rep'&&can('rep')&&rd)rd()}
login();
(async()=>{try{
 DB=makeDB();
 if(!DB){setSy('أدخل مفاتيح الاتصال بقاعدة البيانات لتفعيل الموقع.',1);showCfg();return}
 setSy('جارٍ الاتصال بقاعدة البيانات…',0);
 const tm=setTimeout(()=>{if(!ready)setSy('يتعذر الوصول لقاعدة البيانات حاليًا. تحقق من الاتصال بالإنترنت.',1)},10000);
 DB.doc('settings/users').onSnapshot(s=>{
  if(s.exists){S.users=cp(s.data().list);if(me){const n=S.users.find(x=>x.id===me.id);if(n)me=n}}
  else if(!s.fromCache){DB.doc('settings/users').set({list:S.users}).catch(er)}
  if((s.exists||!s.fromCache)&&!ready){ready=true;clearTimeout(tm);setSy('متصل بقاعدة البيانات ✓',0)}
 },e=>setSy('تعذر الاتصال: '+((e&&e.message)||e),1));
 DB.collection('invoices').onSnapshot(s=>{S.inv=s.docs.map(d=>cp(d.data()));refresh()},e=>setSy('تعذر تحميل الفواتير: '+((e&&e.message)||e),1));
 DB.collection('deleted').onSnapshot(s=>{S.del=s.docs.map(d=>cp(d.data())).sort((a,b)=>a.ts-b.ts);refresh()},()=>{});
}catch(e){setSy('خطأ: '+e.message,1)}
})();
</script>
</body>
</html>
